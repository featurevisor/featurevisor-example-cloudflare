description: Mobile welcome experience with localized variations
tags:
  - all
  - mobile

bucketBy: userId

variablesSchema:
  welcome_message:
    type: string
    defaultValue: Welcome
  show_new_navigation:
    type: boolean
    defaultValue: false

variations:
  - value: control
    weight: 50
    variables:
      welcome_message: Welcome
      show_new_navigation: false

  - value: treatment
    weight: 50
    variables:
      welcome_message: Welkom
      show_new_navigation: true

force:
  staging:
    - conditions: netherlands
      enabled: true
      variation: treatment
    - conditions:
        - attribute: country
          operator: equals
          value: de
      enabled: true
      variation: control

  production:
    - conditions: netherlands
      enabled: true
      variation: treatment
    - conditions:
        - attribute: country
          operator: equals
          value: de
      enabled: true
      variation: control

rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100

  production:
    - key: everyone
      conditions: "*"
      percentage: 100

